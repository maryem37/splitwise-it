[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carveout-copilot"
version = "0.1.0"
description = "Dependency graph separation planner for IT carve-outs"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1",
  "networkx>=3.2",
  "pydantic>=2.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ai = ["groq>=0.11", "python-dotenv>=1.0"]
neo4j = ["neo4j>=5.0"]

[project.scripts]
carveout = "carveout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
