# Fictional portfolio v1: "Nordia Retail", a retail division sold by "Atlas Group".
# Convention: relationship source DEPENDS ON target.
# Edge cases are explained in data/README.md.

planning:
  company: Nordia Retail
  carve_out_description: Retail division of Atlas Group sold to a private equity buyer
  day1: 2027-01-04
  cutover_start: 2027-03-01
  target_tsa_exit: 2027-12-31
  max_assets_per_wave: 8
  weeks_per_wave_gap: 2

assets:
  # ---------- Infrastructure ----------
  - {id: INF-01, name: Atlas Paris Data Centre, type: infrastructure, owner: shared, criticality: 5, users: 0, hosting: parent DC, effort_weeks: 8, tsa_id: TSA-04}
  - {id: INF-02, name: Corporate WAN, type: infrastructure, owner: shared, criticality: 5, users: 0, hosting: parent network, effort_weeks: 6, tsa_id: TSA-04}
  - {id: INF-03, name: Active Directory / SSO, type: infrastructure, owner: shared, criticality: 5, users: 1200, function: identity, hosting: parent DC, effort_weeks: 8, tsa_id: TSA-03, notes: Shared identity for all staff and most apps}
  - {id: INF-04, name: Nordia Azure Landing Zone, type: infrastructure, owner: carved_out, criticality: 4, users: 0, hosting: Azure, effort_weeks: 6}
  - {id: INF-05, name: Legacy Windows Servers, type: infrastructure, owner: parent, criticality: 1, users: 0, hosting: parent DC, effort_weeks: 1}

  # ---------- Data stores ----------
  - {id: DB-01, name: ERP Database, type: datastore, owner: shared, criticality: 5, users: 0, sensitive: true, hosting: parent DC, effort_weeks: 10, licence_id: LIC-02, tsa_id: TSA-01, notes: Holds Atlas and Nordia financial data in one schema}
  - {id: DB-02, name: Customer Database, type: datastore, owner: carved_out, criticality: 5, users: 0, sensitive: true, hosting: parent DC, effort_weeks: 5, notes: Personal data under GDPR}
  - {id: DB-03, name: Product Catalogue DB, type: datastore, owner: carved_out, criticality: 4, users: 0, hosting: Azure, effort_weeks: 3}
  - {id: DB-04, name: Orders DB, type: datastore, owner: carved_out, criticality: 5, users: 0, sensitive: true, hosting: Azure, effort_weeks: 4}
  - {id: DB-05, name: Data Warehouse, type: datastore, owner: shared, criticality: 3, users: 0, hosting: parent DC, effort_weeks: 8, tsa_id: TSA-04}
  - {id: DB-06, name: Legacy Reporting DB, type: datastore, owner: carved_out, criticality: 1, users: 0, hosting: parent DC, effort_weeks: 1}

  # ---------- Applications ----------
  - {id: APP-01, name: Shared ERP, type: application, owner: shared, criticality: 5, users: 450, function: erp, hosting: parent DC, effort_weeks: 30, licence_id: LIC-01, tsa_id: TSA-01, notes: Single instance serving Atlas and Nordia}
  - {id: APP-02, name: E-commerce Web Shop, type: application, owner: carved_out, criticality: 5, users: 90000, function: ecommerce, hosting: Azure, effort_weeks: 6}
  - {id: APP-03, name: POS System, type: application, owner: carved_out, criticality: 5, users: 600, function: pos, hosting: store servers, effort_weeks: 8}
  - {id: APP-04, name: Salesforce-like CRM, type: application, owner: carved_out, criticality: 4, users: 220, function: crm, hosting: SaaS, effort_weeks: 4, licence_id: LIC-03}
  - {id: APP-05, name: Legacy Atlas CRM, type: application, owner: parent, criticality: 2, users: 15, function: crm, hosting: parent DC, effort_weeks: 3, notes: Duplicate of APP-04; a few sales reps still use it}
  - {id: APP-06, name: Inventory Management, type: application, owner: carved_out, criticality: 5, users: 180, function: inventory, hosting: Azure, effort_weeks: 6, notes: Mutual dependency with WMS}
  - {id: APP-07, name: Warehouse Management, type: application, owner: carved_out, criticality: 5, users: 140, function: warehouse, hosting: Azure, effort_weeks: 6, notes: Mutual dependency with Inventory}
  - {id: APP-08, name: Payment Gateway Integration, type: application, owner: carved_out, criticality: 5, users: 0, function: payments, hosting: Azure, effort_weeks: 4, licence_id: LIC-04, notes: Posts settlements to ERP}
  - {id: APP-09, name: HR and Payroll, type: application, owner: shared, criticality: 4, users: 1200, function: hr, hosting: parent DC, effort_weeks: 12, licence_id: LIC-05, tsa_id: TSA-02}
  - {id: APP-10, name: Email and Collaboration, type: application, owner: shared, criticality: 4, users: 1200, function: collaboration, hosting: SaaS, effort_weeks: 6, tsa_id: TSA-03}
  - {id: APP-11, name: BI Dashboards, type: application, owner: carved_out, criticality: 3, users: 60, function: bi, hosting: SaaS, effort_weeks: 3, licence_id: LIC-06}
  - {id: APP-12, name: Legacy Loyalty App, type: application, owner: carved_out, criticality: 1, users: 0, function: loyalty, hosting: legacy servers, effort_weeks: 1, notes: No logins for 18 months}
  - {id: APP-13, name: API Gateway, type: application, owner: carved_out, criticality: 4, users: 0, function: integration, hosting: Azure, effort_weeks: 3}
  - {id: APP-14, name: Finance Consolidation, type: application, owner: shared, criticality: 4, users: 35, function: finance_reporting, hosting: parent DC, effort_weeks: 10, tsa_id: TSA-01}
  - {id: APP-15, name: Supplier Portal, type: application, owner: carved_out, criticality: 3, users: 800, function: procurement, hosting: Azure, effort_weeks: 3}
  - {id: APP-16, name: Customer Support Ticketing, type: application, owner: carved_out, criticality: 3, users: 90, function: support, hosting: SaaS, effort_weeks: 2, licence_id: LIC-07}
  - {id: APP-17, name: Pricing Engine, type: application, owner: carved_out, criticality: 4, users: 25, function: pricing, hosting: Azure, effort_weeks: 4}
  - {id: APP-18, name: Monitoring and Observability, type: application, owner: carved_out, criticality: 3, users: 30, function: monitoring, hosting: Azure, effort_weeks: 2}
  - {id: APP-19, name: Data Integration (ETL), type: application, owner: shared, criticality: 3, users: 0, function: etl, hosting: parent DC, effort_weeks: 6, tsa_id: TSA-04}

