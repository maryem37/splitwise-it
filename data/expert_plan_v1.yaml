# Human-authored evaluation reference. Keep this independent from algorithm output.
# A wave is a planning grouping; shared services retained under TSA are available
# from Day 1 and are listed as prerequisites rather than treated as carve-out moves.
version: 1
portfolio: Nordia Retail
assumptions:
  - Shared parent services remain available under their TSA until the listed exit or an agreed extension.
  - Parallel build work (`build_effort_weeks`) starts at Day 1 (`2027-01-04`); wave cutovers start at or after `2027-03-01`.
  - APP-01 and DB-01 are separated into a Nordia-owned ERP/data platform; APP-01 exits TSA-01 after its dependent workloads cut over.
  - Existing asset IDs are the only IDs allowed in computed plans and generated documents.
  - APP-08's zero interactive users do not make it unused; it processes payment settlement traffic.
strategies:
  INF-01: {strategy: retain_under_tsa, reason: Shared parent data centre; replace only after dependent workloads leave.}
  INF-02: {strategy: retain_under_tsa, reason: Shared WAN; retain while connectivity is required.}
  INF-03: {strategy: rebuild, reason: Shared identity is a separation hub; establish Nordia identity before application cutovers.}
  INF-04: {strategy: migrate, reason: Nordia-owned landing zone is already provisioned; validate it as the target hosting foundation.}
  INF-05: {strategy: retire, reason: Only supports the unused legacy reporting stack.}
  DB-01: {strategy: rebuild, reason: Shared ERP database contains both entities' financial data; segregate and migrate to a Nordia-owned store.}
  DB-02: {strategy: migrate, reason: Carved-out customer data must move with privacy controls and reconciliation.}
  DB-03: {strategy: migrate, reason: Already hosted in Nordia Azure; validate ownership, access and backup controls for the target.}
  DB-04: {strategy: migrate, reason: Already hosted in Nordia Azure; validate target ownership and order data integrity.}
  DB-05: {strategy: retain_under_tsa, reason: Shared warehouse remains while BI and finance reporting are replaced.}
  DB-06: {strategy: retire, reason: No continuing business need after reporting retirement.}
  APP-01: {strategy: retain_under_tsa, reason: Shared ERP cannot be transferred; maintain service while the Nordia ERP replacement is built.}
  APP-02: {strategy: migrate, reason: Core carved-out e-commerce workload; cut over only after payment, catalogue, orders and identity dependencies are ready.}
  APP-03: {strategy: migrate, reason: Store-critical POS depends on ERP, payments, catalogue and parent connectivity.}
  APP-04: {strategy: migrate, reason: Carved-out CRM is the target; validate customer-data access and complete its separation.}
  APP-05: {strategy: retire, reason: Duplicate parent CRM; consolidate the remaining users into APP-04.}
  APP-06: {strategy: migrate, reason: Move with APP-07 as one strongly connected operational unit.}
  APP-07: {strategy: migrate, reason: Move with APP-06 as one strongly connected operational unit.}
  APP-08: {strategy: rebuild, reason: Payment integration must be replaced or recontracted before its non-renewable licence expires.}
  APP-09: {strategy: rebuild, reason: Shared non-transferable HR suite needs a Nordia-owned replacement; protect payroll continuity.}
  APP-10: {strategy: retain_under_tsa, reason: Shared collaboration service remains until identity and tenant separation are complete.}
  APP-11: {strategy: migrate, reason: Carved-out BI dashboards can move after the warehouse and identity path is available.}
  APP-12: {strategy: retire, reason: No logins in 18 months; confirm business owner approval and archive obligations.}
  APP-13: {strategy: migrate, reason: Nordia-owned API gateway is provisioned; validate it as a prerequisite for application cutovers.}
  APP-14: {strategy: rebuild, reason: Shared finance reporting depends on the ERP and warehouse; replace after core finance data is separated.}
  APP-15: {strategy: migrate, reason: Supplier portal is carved out but depends on ERP and identity.}
  APP-16: {strategy: migrate, reason: Move the support service after target CRM and identity are ready.}
  APP-17: {strategy: migrate, reason: Pricing engine is carved out and depends on the product catalogue and ERP.}
  APP-18: {strategy: migrate, reason: Nordia-owned monitoring service is already on the target platform; validate coverage before cutovers.}
  APP-19: {strategy: rebuild, reason: Shared ETL reads the ERP database and feeds the shared warehouse; rebuild after data ownership is separated.}

# Wave numbers below describe the expert's expected order, not an exact schedule.
# Shared TSA assets are external prerequisites and do not consume move capacity.
expected_waves:
  - {wave: 1, assets: [INF-03, INF-04, APP-13, APP-18], rationale: Establish target identity, platform, integration and monitoring while parent identity remains available under TSA.}
  - {wave: 2, assets: [DB-02, DB-03, DB-04, APP-04, APP-08, APP-17], rationale: Prepare carved-out data, renew/replace payment capability, and core application foundations.}
  - {wave: 3, assets: [APP-06, APP-07, APP-11, APP-19, APP-05, APP-12, DB-06], rationale: Move the inventory/WMS cycle together, transition BI/ETL flows, and retire unused or duplicate legacy assets.}
  - {wave: 4, assets: [INF-05, APP-09, APP-15, APP-16], rationale: Move HR and dependent services, then retire the legacy server platform.}
  - {wave: 5, assets: [APP-02, APP-03, APP-14, APP-01, INF-02], rationale: Cut over customer and store workloads after payment, catalogue, ERP and identity paths are proven, then exit shared ERP/finance/WAN TSAs.}
  - {wave: 6, assets: [DB-01, DB-05, INF-01, APP-10], rationale: Close remaining shared data warehouse, data centre and collaboration TSA dependencies after consuming workloads have exited.}
top_risks:
  - {id: R-01, risk: ERP and database separation misses TSA-01 end date, cause: Shared platform, large effort and long dependency chain, likelihood: high, impact: critical, owner: Separation lead, mitigation: Approve an ERP replacement milestone plan and negotiate contingency before Day 1.}
  - {id: R-02, risk: Payment settlements stop when LIC-04 expires, cause: Licence ends before the planned cutover, likelihood: high, impact: critical, owner: Payments lead, mitigation: Secure a renewal or replacement contract and rehearse settlement reconciliation.}
  - {id: R-03, risk: Inventory and warehouse cutover leaves inconsistent stock, cause: APP-06 and APP-07 have a mutual dependency, likelihood: medium, impact: high, owner: Supply-chain lead, mitigation: Cut over as one unit with a reconciled stock snapshot and tested rollback.}
  - {id: R-04, risk: Shared identity outage blocks user and service access, cause: INF-03 authenticates many applications, likelihood: medium, impact: critical, owner: Identity lead, mitigation: Build and test Nordia identity, federation and staged account migration before dependent waves.}
  - {id: R-05, risk: Sensitive customer or financial data is disclosed or corrupted, cause: Shared ERP and personal-data stores need segregation and migration, likelihood: medium, impact: critical, owner: Data protection lead, mitigation: Map ownership, restrict access, encrypt transfers and reconcile record counts.}
  - {id: R-06, risk: Payroll is unavailable at TSA-02 expiry, cause: HR replacement depends on finance and shared identity, likelihood: medium, impact: critical, owner: HR lead, mitigation: Confirm an extension or parallel payroll run and obtain sign-off before exit.}
  - {id: R-07, risk: Business cutovers exceed wave capacity or freeze windows, cause: Dependencies and workload size cluster several moves, likelihood: medium, impact: high, owner: Programme manager, mitigation: Validate capacity, freeze periods and business readiness before baselining dates.}
  - {id: R-08, risk: CRM consolidation loses sales or customer history, cause: Remaining APP-05 users and duplicate records, likelihood: medium, impact: high, owner: Sales operations lead, mitigation: Map users and records, reconcile migration and obtain business-owner approval to retire.}
  - {id: R-09, risk: TSA extensions increase cost and delay independence, cause: Data centre, identity and shared reporting remain dependencies, likelihood: high, impact: high, owner: TSA manager, mitigation: Set service-specific exit criteria, owners and escalation dates; track monthly cost.}
  - {id: R-10, risk: Supplier or licence terms prevent timely transfer, cause: Multiple systems have non-transferable contracts or notice periods, likelihood: medium, impact: high, owner: Commercial lead, mitigation: Confirm assignment rights, notice dates and replacement procurement early.}
